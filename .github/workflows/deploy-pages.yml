name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_SUPABASE_URL: https://xctpeafrhfhokgrgwpdr.supabase.co
          VITE_NEXORA_AI_ENDPOINT: https://nexora-api-ars8.onrender.com
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_SP59hxu0kWVaYrwGsjNFEA_F_8cFB4k' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
