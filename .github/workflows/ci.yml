name: CI
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    needs: core
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build

  repository-sanity:
    runs-on: ubuntu-latest
    needs: [core, web]
    steps:
      - uses: actions/checkout@v4
      - name: Check security documentation
        run: |
          test -f SECURITY.md
          test -f docs/ARCHITECTURE.md
          test -f docs/FORMAT.md
          test -f audit/SCHEMA.md
      - name: Check client foundations
        run: |
          test -f windows/src-tauri/Cargo.toml
          test -f android/protocol/NSV1.md
