name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    needs: core
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install
      - run: npm run build

  windows:
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Generate Windows bundle icon when missing
        shell: pwsh
        run: |
          $iconPath = "windows/src-tauri/icons/icon.ico"
          New-Item -ItemType Directory -Force -Path "windows/src-tauri/icons" | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 64, 64
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(20, 24, 45))
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(139, 124, 255))
          $graphics.FillRectangle($brush, 8, 8, 48, 48)
          $font = New-Object System.Drawing.Font("Arial", 30, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
          $white = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $graphics.DrawString("N", $font, $white, 16, 12)
          $bitmap.Save("$env:RUNNER_TEMP/nexora-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose(); $brush.Dispose(); $white.Dispose(); $font.Dispose()
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::FromFile("$env:RUNNER_TEMP/nexora-icon.png")
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $stream = [System.IO.File]::Open($iconPath, [System.IO.FileMode]::Create)
          $icon.Save($stream)
          $stream.Dispose(); $icon.Dispose(); $bmp.Dispose()
      - run: ../../web/node_modules/.bin/tauri build --debug --config ../tauri.conf.json
        working-directory: windows/src-tauri

  android:
    runs-on: ubuntu-latest
    needs: core
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - run: gradle :app:testDebugUnitTest
      - run: gradle :app:assembleDebug --stacktrace --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g"

  repository-sanity:
    runs-on: ubuntu-latest
    needs: [core, backend, web, windows, android]
    steps:
      - uses: actions/checkout@v6
      - run: test -f SECURITY.md
      - run: test -f docs/ARCHITECTURE.md
      - run: test -f docs/FORMAT.md
      - run: test -f audit/SCHEMA.md
      - run: test -f windows/src-tauri/Cargo.toml
      - run: test -f android/protocol/NSV1.md
