name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    needs: core
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install
      - run: npm run build

  windows:
    runs-on: windows-latest
    needs: core
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run build
      - run: npx tauri build --debug

  repository-sanity:
    runs-on: ubuntu-latest
    needs: [core, web]
    steps:
      - uses: actions/checkout@v6
      - run: test -f SECURITY.md
      - run: test -f docs/ARCHITECTURE.md
      - run: test -f docs/FORMAT.md
      - run: test -f audit/SCHEMA.md
      - run: test -f windows/src-tauri/Cargo.toml
      - run: test -f android/protocol/NSV1.md
